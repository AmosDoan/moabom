<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<title>{% block title %}모아봄 - 자산 대시보드{% endblock %}</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#1c1f23; --muted:#6b7280; --line:#e5e7eb;
    --up:#d92d20; --down:#1d68d9; --accent:#111827;
  }
  :root[data-theme="dark"] {
    --bg:#0f1216; --card:#171b21; --ink:#e7e9ec; --muted:#9aa3af; --line:#262c34;
    --up:#ff6b5e; --down:#5b9bff; --accent:#e7e9ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1216; --card:#171b21; --ink:#e7e9ec; --muted:#9aa3af; --line:#262c34;
      --up:#ff6b5e; --down:#5b9bff; --accent:#e7e9ec;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line);
           background:var(--card); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:700; }
  header nav { margin-left:auto; display:flex; gap:14px; }
  header nav a { color:var(--muted); text-decoration:none; font-size:14px; }
  header nav a:hover { color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .kpi .label { color:var(--muted); font-size:12px; }
  .kpi .value { font-size:22px; font-weight:700; margin-top:2px; }
  .up { color:var(--up); } .down { color:var(--down); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .tablewrap { overflow-x:auto; }
  .bar { height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .acc-head { display:flex; justify-content:space-between; align-items:baseline; margin:6px 0 4px; }
  .acc-head .n { font-weight:700; } .acc-head .v { color:var(--muted); font-size:13px; }
  .muted { color:var(--muted); font-size:13px; }
  .btn { display:inline-block; padding:7px 12px; border-radius:8px; border:1px solid var(--line);
         background:var(--card); color:var(--ink); text-decoration:none; font-size:14px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  form.inline { display:inline; }
  input,select { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px;
                 background:var(--bg); color:var(--ink); font-size:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stale { color:var(--muted); font-size:11px; }
  @media (max-width: 640px) {
    header { flex-wrap:wrap; gap:6px 14px; padding:12px 16px; }
    header h1 { flex-basis:100%; }
    header nav { margin-left:0; gap:14px; flex-wrap:wrap; }
    main { padding:14px; }
    .kpis { grid-template-columns:1fr 1fr; }
    .kpi .value { font-size:20px; }
  }
  #app-loading { position:fixed; inset:0; z-index:9999; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:14px; background:var(--bg);
    transition:opacity .3s ease; }
  #app-loading .spin { width:38px; height:38px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite; }
  #app-loading .lt { color:var(--muted); font-size:13px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Privacy mode: blur concrete amounts, keep ratios/percentages visible */
  html.priv-on .priv { filter:blur(7px); -webkit-filter:blur(7px); user-select:none; }
  html.priv-on .priv-chart { filter:blur(9px); pointer-events:none; }
  html.priv-on .priv-notip { pointer-events:none; }  /* keep chart shape, hide amount tooltips */
  html.priv-on #chart-alloc .apexcharts-datalabel-value { filter:blur(7px); }  /* donut center total */
  /* Privacy: show graph shape but hide the numeric amount labels */
  html.priv-on #chart-net .apexcharts-yaxis-label,
  html.priv-on #chart-bars .apexcharts-xaxis-label,
  html.priv-on #chart-bars .apexcharts-datalabels { opacity:0; }
  #priv-toggle { cursor:pointer; }
  /* Live refresh indicator in the sticky header (populated by dashboard JS) */
  .hdr-live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .hdr-live:empty { display:none; }
  #live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#0ca30c;
              vertical-align:middle; opacity:.35; }
  @keyframes beat { 0% { transform:scale(1.8); opacity:1; box-shadow:0 0 0 4px rgba(12,163,12,.25); }
                    100% { transform:scale(1); opacity:.35; box-shadow:0 0 0 0 rgba(12,163,12,0); } }
  #live-dot.beat { animation:beat 1s ease-out; }
  #live-status.okflash { color:#0ca30c; font-weight:700; border-radius:4px; padding:1px 4px; animation:statusflash 1.4s ease-out; }
  @keyframes statusflash { 0% { background:rgba(12,163,12,.22); } 100% { background:transparent; } }
</style>
<script>
  // Apply saved privacy + theme before paint (no flash).
  try {
    if (localStorage.getItem('asset-privacy') === '1') document.documentElement.classList.add('priv-on');
    var t = localStorage.getItem('asset-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="app-loading"><div class="spin"></div><div class="lt">불러오는 중…</div></div>
<script>
  (function () {
    function hide() {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.style.display = 'none'; }, 300);
    }
    window.addEventListener('load', function () { setTimeout(hide, 150); });
    setTimeout(hide, 8000); // fallback so it never sticks
  })();
</script>
<header>
  <h1><a href="/" style="color:inherit; text-decoration:none;">💰 모아봄 - 자산 대시보드 <span style="font-weight:400; color:var(--muted); font-size:11px;">v{{ VERSION }}</span></a></h1>
  <span id="hdr-live" class="hdr-live" aria-live="polite"></span>
  <nav>
    <a href="/">현황</a>
    <a href="/positions">종목 관리</a>
    <a href="/log">변경 로그</a>
    <a href="/password">비밀번호</a>
    <a href="#" id="theme-toggle" title="다크/라이트 전환">🌙</a>
    <a href="#" id="priv-toggle">🙈 비공개</a>
    <a href="/logout">로그아웃</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
<script>
  (function () {
    var KEY = 'asset-privacy';
    function apply(on) {
      document.documentElement.classList.toggle('priv-on', on);
      var b = document.getElementById('priv-toggle');
      if (b) b.textContent = on ? '👁 공개' : '🙈 비공개';
    }
    var on = false;
    try { on = localStorage.getItem(KEY) === '1'; } catch (e) {}
    apply(on);
    var b = document.getElementById('priv-toggle');
    if (b) b.addEventListener('click', function (e) {
      e.preventDefault(); on = !on;
      try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
      apply(on);
      location.reload();  // re-render charts so amounts inside SVG mask reliably (mobile)
    });
  })();

  (function () {
    function effective() {
      return document.documentElement.getAttribute('data-theme')
        || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    var t = document.getElementById('theme-toggle');
    if (t) {
      t.textContent = effective() === 'dark' ? '🌙' : '☀️';
      t.addEventListener('click', function (e) {
        e.preventDefault();
        var next = effective() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('asset-theme', next); } catch (e) {}
        document.documentElement.setAttribute('data-theme', next);
        location.reload();  // re-render charts with the new theme
      });
    }
  })();
</script>
</body>
</html>
