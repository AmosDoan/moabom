<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<title>{% block title %}자산 대시보드{% endblock %}</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#1c1f23; --muted:#6b7280; --line:#e5e7eb;
    --up:#d92d20; --down:#1d68d9; --accent:#111827;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#171b21; --ink:#e7e9ec; --muted:#9aa3af; --line:#262c34;
            --up:#ff6b5e; --down:#5b9bff; --accent:#e7e9ec; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line);
           background:var(--card); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:700; }
  header nav { margin-left:auto; display:flex; gap:14px; }
  header nav a { color:var(--muted); text-decoration:none; font-size:14px; }
  header nav a:hover { color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .kpi .label { color:var(--muted); font-size:12px; }
  .kpi .value { font-size:22px; font-weight:700; margin-top:2px; }
  .up { color:var(--up); } .down { color:var(--down); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .tablewrap { overflow-x:auto; }
  .bar { height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .acc-head { display:flex; justify-content:space-between; align-items:baseline; margin:6px 0 4px; }
  .acc-head .n { font-weight:700; } .acc-head .v { color:var(--muted); font-size:13px; }
  .muted { color:var(--muted); font-size:13px; }
  .btn { display:inline-block; padding:7px 12px; border-radius:8px; border:1px solid var(--line);
         background:var(--card); color:var(--ink); text-decoration:none; font-size:14px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  form.inline { display:inline; }
  input,select { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px;
                 background:var(--bg); color:var(--ink); font-size:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stale { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>💰 자산 대시보드</h1>
  <nav>
    <a href="/">현황</a>
    <a href="/positions">종목 관리</a>
    <a href="/log">변경 로그</a>
    <a href="/password">비밀번호</a>
    <a href="/logout">로그아웃</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
