{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;">
  <div class="acc-head"><span class="n">비밀번호 변경</span></div>
  {% if ok %}
    <p style="color:var(--up);">비밀번호가 변경되었습니다. 다음 로그인부터 새 비밀번호를 사용하세요.</p>
    <a class="btn" href="/">현황으로</a>
  {% else %}
  <form method="post" action="/password">
    <label>현재 비밀번호</label>
    <input name="current" type="password" autocomplete="current-password" required>
    <label>새 비밀번호 <span class="muted">(8자 이상)</span></label>
    <input name="new1" type="password" autocomplete="new-password" required>
    <label>새 비밀번호 확인</label>
    <input name="new2" type="password" autocomplete="new-password" required>
    {% if error %}<p style="color:var(--down); font-size:13px; margin-top:12px;">{{ error }}</p>{% endif %}
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button class="btn primary" type="submit">변경</button>
      <a class="btn" href="/">취소</a>
    </div>
  </form>
  {% endif %}
</div>
{% endblock %}
