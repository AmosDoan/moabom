services:
  asset:
    build: .
    container_name: asset-dashboard
    restart: unless-stopped
    ports:
      - "8842:8000"          # host 8842 -> reverse proxy target
    volumes:
      - ./data:/srv/data          # SQLite persists here (pre-create on NAS!)
      - ./app:/srv/app            # source bind-mounted for fast dev (scp + auto-reload)
      - ./templates:/srv/templates
      - ./static:/srv/static
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ASSET_USER=${ASSET_USER:?set ASSET_USER}
      - ASSET_PASSWORD=${ASSET_PASSWORD:?set ASSET_PASSWORD}
      - ASSET_SHEET_ID=${ASSET_SHEET_ID:-}                  # (선택) 대시보드 읽기 연동
      - ASSET_BACKUP_SHEET_ID=${ASSET_BACKUP_SHEET_ID:-}    # (선택) Stock 탭 백업 쓰기(편집자 권한 필요)
      - GOOGLE_SA_KEY=/srv/data/gsa.json
      - TZ=Asia/Seoul
